<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Campus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <meta name="theme-color" content="#0a0e18">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="/CSS/style.css?v=2.1">
</head>

<body>
    <header>
        <nav>
            <h2>Smart Campus</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="facilities.html">Facilities</a></li>
                <li><a href="announcements.html">Announcements</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-card">
                <h1>Welcome Back 👋</h1>
                <p>Login to your account to access all features</p>

                <form id="loginForm">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>

                    <button type="submit">Login</button>
                </form>

                <p class="auth-switch">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Smart Campus Utility and Maintenance Management System. All Rights Reserved.</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            updateNavigation();

            // Check if already logged in
            if (isLoggedIn()) {
                window.location.href = 'dashboard.html';
                return;
            }

            const form = document.getElementById('loginForm');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!email || !password) {
                    showToast('Please fill in all fields', 'error');
                    return;
                }

                if (!validateEmail(email)) {
                    showToast('Please enter a valid email address', 'error');
                    return;
                }

                // Show loading state
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Logging in...';
                submitBtn.disabled = true;

                try {
                    const result = await login(email, password);

                    if (result) {
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 500);
                    }
                } catch (error) {
                    showToast(error.message || 'Login failed. Please try again.', 'error');
                } finally {
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
