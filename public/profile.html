<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Smart Campus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <meta name="theme-color" content="#0a0e18">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="/CSS/style.css?v=2.1">
</head>

<body>
    <header>
        <nav>
            <h2>Smart Campus</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="track-section">
            <div class="page-header">
                <h1>👤 My Profile</h1>
                <p>Keep your account information up to date</p>
            </div>

            <div class="profile-summary">
                <div class="profile-avatar">👤</div>
                <div>
                    <h2 id="userName">Loading...</h2>
                    <p id="userRole" class="text-muted">—</p>
                </div>
            </div>

            <form class="report-form" id="profileForm">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" placeholder="John Doe" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="your@email.com" required>

                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" placeholder="S12345" required>

                <label for="password">New Password (leave blank to keep current)</label>
                <input type="password" id="password" placeholder="Minimum 6 characters">

                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" placeholder="Re-enter new password">

                <button type="submit">💾 Save Changes</button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 Smart Campus Utility and Maintenance Management System. All Rights Reserved.</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            updateNavigation();

            // Check authentication
            if (!isLoggedIn()) {
                showToast('Please login to view your profile', 'error');
                setTimeout(() => window.location.href = 'login.html', 1000);
                return;
            }

            const form = document.getElementById('profileForm');

            // Load current profile from the server (fresh copy, not cached in localStorage)
            try {
                const profile = await getUserProfile();
                if (profile) {
                    document.getElementById('full_name').value = profile.full_name || '';
                    document.getElementById('email').value = profile.email || '';
                    document.getElementById('student_id').value = profile.student_id || '';
                    document.getElementById('userName').textContent = profile.full_name || 'User';
                    document.getElementById('userRole').textContent =
                        profile.role === 'admin' ? 'Administrator' : 'Student';
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                showToast('Could not load your profile', 'error');
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const full_name = document.getElementById('full_name').value.trim();
                const email = document.getElementById('email').value.trim();
                const student_id = document.getElementById('student_id').value.trim();
                const password = document.getElementById('password').value;
                const confirm_password = document.getElementById('confirm_password').value;

                // Validate
                if (!full_name || !email || !student_id) {
                    showToast('Please fill in all required fields', 'error');
                    return;
                }

                if (!validateEmail(email)) {
                    showToast('Please enter a valid email address', 'error');
                    return;
                }

                if (password) {
                    if (!validatePassword(password)) {
                        showToast('Password must be at least 6 characters long', 'error');
                        return;
                    }
                    if (password !== confirm_password) {
                        showToast('Passwords do not match', 'error');
                        return;
                    }
                }

                // Build the payload (only what changed)
                const current = getCurrentUser() || {};
                const payload = {};
                if (full_name !== (current.full_name || '')) payload.full_name = full_name;
                if (email !== (current.email || '')) payload.email = email;
                if (student_id !== (current.student_id || '')) payload.student_id = student_id;
                if (password) payload.password = password;

                if (Object.keys(payload).length === 0) {
                    showToast('No changes to save', 'info');
                    return;
                }

                // Show loading state
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Saving...';
                submitBtn.disabled = true;

                try {
                    const result = await updateUserProfile(payload);

                    if (result && result.user) {
                        // Refresh the cached user in localStorage
                        localStorage.setItem('user', JSON.stringify(result.user));
                        document.getElementById('userName').textContent = result.user.full_name || 'User';
                        document.getElementById('userRole').textContent =
                            result.user.role === 'admin' ? 'Administrator' : 'Student';
                        // Clear password fields after a successful save
                        document.getElementById('password').value = '';
                        document.getElementById('confirm_password').value = '';
                        // Rebuild nav (e.g. admin link depends on role stored locally)
                        updateNavigation();
                    }
                } catch (error) {
                    showToast(error.message || 'Failed to update profile. Please try again.', 'error');
                } finally {
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
