<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue - Smart Campus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <meta name="theme-color" content="#0a0e18">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="/CSS/style.css?v=2.1">
</head>

<body>
    <header>
        <nav>
            <h2>Smart Campus</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="facilities.html">Facilities</a></li>
                <li><a href="announcements.html">Announcements</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="report-section">
            <h1>⚠️ Report an Issue</h1>
            <p>Help us improve campus facilities by reporting any issues you encounter</p>

            <form class="report-form" id="reportForm">
                <label for="facility">Facility *</label>
                <select id="facility" required>
                    <option value="">Select a facility</option>
                    <option value="Washrooms">Washrooms</option>
                    <option value="Water Coolers">Water Coolers</option>
                    <option value="Water Tanks">Water Tanks</option>
                    <option value="Library">Library</option>
                    <option value="Medical Room">Medical Room</option>
                    <option value="Xerox Center">Xerox Center</option>
                    <option value="Cafeteria">Cafeteria</option>
                </select>

                <label for="title">Issue Title *</label>
                <input type="text" id="title" placeholder="Brief title of the issue" required>

                <label for="description">Description *</label>
                <textarea id="description" placeholder="Describe the issue in detail" required></textarea>

                <div class="form-row">
                    <div>
                        <label for="reporter_name">Your Name *</label>
                        <input type="text" id="reporter_name" placeholder="Your name" required>
                    </div>
                    <div>
                        <label for="reporter_email">Email *</label>
                        <input type="email" id="reporter_email" placeholder="your@email.com" required>
                    </div>
                <div style="margin-top: 16px; margin-bottom: 20px;">
                    <label for="issue_image">📸 Attach Photo (Optional, max 5MB)</label>
                    <input type="file" id="issue_image" accept="image/png, image/jpeg, image/jpg, image/webp, image/gif" style="margin-top: 6px; width: 100%;">
                    <div id="imagePreviewContainer" style="display: none; margin-top: 12px; position: relative; max-width: 240px;">
                        <img id="imagePreview" src="" alt="Photo Preview" style="width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border, #2d3748);">
                        <button type="button" id="removeImageBtn" style="position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.8); color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;">✕</button>
                    </div>
                </div>

                <button type="submit">📤 Submit Report</button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 Smart Campus Utility and Maintenance Management System. All Rights Reserved.</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            updateNavigation();

            const form = document.getElementById('reportForm');

            // Prefill reporter details when a user is logged in
            const user = getCurrentUser();
            if (user) {
                if (user.full_name) document.getElementById('reporter_name').value = user.full_name;
                if (user.email) document.getElementById('reporter_email').value = user.email;
            }

            // Load facilities dynamically (hardcoded options act as fallback if the API is down)
            try {
                const facilities = await getFacilities();
                const facilitySelect = document.getElementById('facility');
                if (facilities && facilities.length > 0) {
                    facilitySelect.innerHTML = '<option value="">Select a facility</option>' +
                        facilities.map(f =>
                            `<option value="${escapeHtml(f.name)}">${escapeHtml(f.name)}</option>`
                        ).join('');
                }
            } catch (error) {
                console.error('Error loading facilities for report form:', error);
            }

            // Image attachment preview handling
            const imageInput = document.getElementById('issue_image');
            const previewContainer = document.getElementById('imagePreviewContainer');
            const previewImg = document.getElementById('imagePreview');
            const removeImageBtn = document.getElementById('removeImageBtn');

            imageInput.addEventListener('change', function () {
                const file = this.files[0];
                if (file) {
                    if (file.size > 5 * 1024 * 1024) {
                        showToast('Image file size exceeds 5MB limit', 'error');
                        this.value = '';
                        previewContainer.style.display = 'none';
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        previewImg.src = e.target.result;
                        previewContainer.style.display = 'inline-block';
                    };
                    reader.readAsDataURL(file);
                } else {
                    previewContainer.style.display = 'none';
                }
            });

            removeImageBtn.addEventListener('click', function () {
                imageInput.value = '';
                previewContainer.style.display = 'none';
                previewImg.src = '';
            });

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                // Get form data
                const facility = document.getElementById('facility').value;
                const title = document.getElementById('title').value.trim();
                const description = document.getElementById('description').value.trim();
                const reporter_name = document.getElementById('reporter_name').value.trim();
                const reporter_email = document.getElementById('reporter_email').value.trim();
                const selectedFile = imageInput.files[0];

                // Validate
                if (!facility || !title || !description || !reporter_name || !reporter_email) {
                    showToast('Please fill in all required fields', 'error');
                    return;
                }

                if (!validateEmail(reporter_email)) {
                    showToast('Please enter a valid email address', 'error');
                    return;
                }

                // Show loading state
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.disabled = true;

                try {
                    let image_url = null;
                    if (selectedFile) {
                        submitBtn.textContent = 'Uploading photo...';
                        const uploadRes = await uploadFile(selectedFile);
                        image_url = uploadRes.url;
                    }

                    submitBtn.textContent = 'Submitting report...';
                    const result = await reportIssue({
                        facility,
                        title,
                        description,
                        reporter_name,
                        reporter_email,
                        image_url
                    });

                    if (result) {
                        form.reset();
                        previewContainer.style.display = 'none';
                        previewImg.src = '';
                        showToast('✅ Issue reported successfully!', 'success');
                    }
                } catch (error) {
                    showToast(error.message || 'Failed to report issue. Please try again.', 'error');
                } finally {
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
