<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Campus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <meta name="theme-color" content="#0a0e18">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <header>
        <nav>
            <h2>Smart Campus</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="facilities.html">Facilities</a></li>
                <li><a href="announcements.html">Announcements</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-card">
                <h1>Create Account 🚀</h1>
                <p>Join Smart Campus and stay informed</p>

                <form id="signupForm">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" placeholder="John Doe" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>

                    <label for="student_id">Student ID</label>
                    <input type="text" id="student_id" placeholder="S12345" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimum 6 characters" required>

                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" placeholder="Confirm your password" required>

                    <button type="submit">Create Account</button>
                </form>

                <p class="auth-switch">
                    Already have an account? <a href="login.html">Login</a>
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Smart Campus Utility and Maintenance Management System. All Rights Reserved.</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            updateNavigation();

            // Check if already logged in
            if (isLoggedIn()) {
                window.location.href = 'dashboard.html';
                return;
            }

            const form = document.getElementById('signupForm');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const full_name = document.getElementById('full_name').value.trim();
                const email = document.getElementById('email').value.trim();
                const student_id = document.getElementById('student_id').value.trim();
                const password = document.getElementById('password').value.trim();
                const confirm_password = document.getElementById('confirm_password').value.trim();

                // Validate
                if (!full_name || !email || !student_id || !password || !confirm_password) {
                    showToast('Please fill in all fields', 'error');
                    return;
                }

                if (!validateEmail(email)) {
                    showToast('Please enter a valid email address', 'error');
                    return;
                }

                if (!validatePassword(password)) {
                    showToast('Password must be at least 6 characters long', 'error');
                    return;
                }

                if (password !== confirm_password) {
                    showToast('Passwords do not match', 'error');
                    return;
                }

                // Show loading state
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Creating account...';
                submitBtn.disabled = true;

                try {
                    const result = await signup({
                        full_name,
                        email,
                        student_id,
                        password
                    });

                    if (result) {
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 500);
                    }
                } catch (error) {
                    showToast(error.message || 'Signup failed. Please try again.', 'error');
                } finally {
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
