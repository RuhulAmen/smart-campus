<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports - Smart Campus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <meta name="theme-color" content="#0a0e18">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <header>
        <nav>
            <h2>Smart Campus</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="my-reports.html">My Reports</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="track-section">
            <div class="page-header">
                <h1>📋 My Reports</h1>
                <p>Track the status of issues you have reported</p>
            </div>

            <div class="track-box">
                <input type="email" id="trackEmail" placeholder="Enter your email address" required>
                <button type="button" onclick="loadMyReports()">🔍 Track My Reports</button>
            </div>

            <div id="trackResults">
                <p class="text-muted" style="text-align:center; padding: 24px 0;">
                    Enter the email you used when reporting an issue to see its current status.
                </p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Smart Campus Utility and Maintenance Management System. All Rights Reserved.</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            updateNavigation();

            // Prefill with the logged-in user's email if available
            const user = getCurrentUser();
            const emailInput = document.getElementById('trackEmail');
            if (user && user.email) {
                emailInput.value = user.email;
                loadMyReports();
            }
        });

        function statusLabel(status) {
            const labels = {
                pending: 'Pending',
                in_progress: 'In Progress',
                resolved: 'Resolved',
                rejected: 'Rejected'
            };
            return labels[status] || status || 'Unknown';
        }

        async function loadMyReports() {
            const emailInput = document.getElementById('trackEmail');
            const email = emailInput.value.trim();

            if (!email) {
                showToast('Please enter your email address', 'error');
                return;
            }

            if (!validateEmail(email)) {
                showToast('Please enter a valid email address', 'error');
                return;
            }

            const container = document.getElementById('trackResults');

            // Loading state
            container.innerHTML = '<p class="text-muted" style="text-align:center; padding: 24px 0;">Searching for your reports...</p>';

            try {
                const issues = await trackIssues(email);

                if (!issues || issues.length === 0) {
                    container.innerHTML = `
                        <div class="report-card" style="text-align:center;">
                            <span style="font-size: 2.5rem; display: block; margin-bottom: 8px;">📭</span>
                            <h3 style="color: var(--text-main);">No reports found</h3>
                            <p class="text-muted">No issues were reported with <strong>${escapeHtml(email)}</strong>.
                            If you just submitted one, it may take a moment to appear.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <p class="report-count">Found ${issues.length} report${issues.length === 1 ? '' : 's'} for
                        <strong>${escapeHtml(email)}</strong></p>
                ` + issues.map(issue => `
                    <div class="report-card">
                        <div class="report-card-top">
                            <h3>${escapeHtml(issue.title)}</h3>
                            <span class="issue-badge issue-badge-${escapeHtml(issue.status)}">${statusLabel(issue.status)}</span>
                        </div>
                        <div class="report-meta">📍 ${escapeHtml(issue.facility)}</div>
                        <p>${escapeHtml(issue.description)}</p>
                        ${issue.image_url ? `
                            <div style="margin: 10px 0;">
                                <a href="${escapeHtml(issue.image_url)}" target="_blank" rel="noopener noreferrer" style="display: inline-block;">
                                    <img src="${escapeHtml(issue.image_url)}" alt="Attached Issue Photo" style="max-width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border, #333);">
                                </a>
                            </div>
                        ` : ''}
                        <div class="report-meta">📅 Reported on ${new Date(issue.date).toLocaleDateString()}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error tracking issues:', error);
                container.innerHTML = `
                    <div class="report-card" style="text-align:center;">
                        <h3 style="color: var(--text-main);">⚠️ Something went wrong</h3>
                        <p class="text-muted">${escapeHtml(error.message || 'Could not load your reports. Please try again.')}</p>
                    </div>
                `;
            }
        }

        // Allow pressing Enter in the email field to search
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('trackEmail').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loadMyReports();
                }
            });
        });

        window.loadMyReports = loadMyReports;
    </script>
</body>

</html>
